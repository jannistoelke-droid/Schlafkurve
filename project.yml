# XcodeGen spec – becomes Schlafkurve.xcodeproj on CI (`xcodegen generate`).
# The bundle ID must NEVER change after the first install (Sideloadly keeps the data only for the same ID).
name: Schlafkurve
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"        # CI overrides with the run number
    CODE_SIGNING_ALLOWED: "NO"          # signing happens later in Sideloadly
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  SleepEngine:
    path: Packages/SleepEngine
targets:
  Schlafkurve:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SleepEngine
        product: SleepEngineCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Schlafkurve
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Schlafkurve hört nachts zu, um Bewegungen, Atmung, Schnarchen und Sprechen zu erkennen. Aufnahmen bleiben auf diesem iPhone."
        NSAlarmKitUsageDescription: "Schlafkurve weckt dich mit einem Wecker im leichtesten Schlafmoment – auch bei Stummschaltung und Fokus."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jt7q.schlafkurve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Schlafkurve:
    build:
      targets:
        Schlafkurve: all
    run:
      config: Debug
    archive:
      config: Release
