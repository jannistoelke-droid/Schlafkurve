# XcodeGen spec – VORLAGE. Wird auf dem CI-Server mit `xcodegen generate` zur Schlafkurve.xcodeproj.
# Phase 0: Bundle-ID-Präfix anpassen (einmal festlegen, danach NIE wieder ändern – sonst sind
# die Daten auf dem iPhone beim nächsten Sideload weg), dann prüfen/ergänzen.
name: Schlafkurve
options:
  bundleIdPrefix: de.CHANGE-ME
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"        # CI overrides with the run number
    CODE_SIGNING_ALLOWED: "NO"          # signing happens later in Sideloadly
    CODE_SIGN_IDENTITY: ""
packages:
  SleepEngine:
    path: Packages/SleepEngine
targets:
  Schlafkurve:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SleepEngine
        product: SleepEngineCore
      - package: SleepEngine
        product: SleepEngineDSP
      - package: SleepEngine
        product: SleepEngineAudio
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Schlafkurve
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Schlafkurve hört nachts zu, um Bewegungen, Atmung, Schnarchen und Sprechen zu erkennen. Aufnahmen bleiben auf diesem iPhone."
        NSAlarmKitUsageDescription: "Schlafkurve weckt dich mit einem Wecker im leichtesten Schlafmoment – auch bei Stummschaltung und Fokus."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.CHANGE-ME.schlafkurve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
